brain_node:
  ros__parameters:
    # 按模块名分组
    SelfState:
      odom_factor: 1.2

    Observations:
      # 用于投影位置的俯仰角
      robot_height: 0.9

    FieldProvider:
      # 可选 kid_size、adult_size、robo_league；几何定义由 FieldProvider 统一维护。
      field_size: kid_size

    Localization:
      # 已有位姿后的局部校正搜索半宽；首次全局定位不依赖这组值。
      search_range:
        x: 1.0
        y: 1.0
        yaw: 0.7853981633974483
      min_markers: 4
      residual_tolerance: 0.4
      # 全局定位出现镜像候选时，残差在此范围内优先沿用当前位姿所在的一侧。
      global_candidate_margin: 0.1
      input_timeout: 1.0
      correction_interval: 0.5
      # 场线定位当前停用：只保留视觉观测，暂不让它校正位姿。
      line_correction: false
      # 启用场线定位后，只接收不短于此值的机器人坐标系线段。
      line_min_length: 0.2

    BallState:
      min_confidence: 50.0
      input_timeout: 0.3
      # 新视觉位置以此比例混入；短暂漏检仍沿用最后一份可靠球状态。
      position_smoothing: 0.35
      hold_duration: 0.3
      # 首次看到球不立刻进入带球，连续看到两帧后才确认。
      confirm_frames: 2

    FieldPotential:
      # 只描述场地偏好：边界推回场内、球门吸引、对方底线角落回退。
      border_range: 0.8
      border_weight: 3.0
      goal_weight: 1.5
      corner_weight: 0.5

    Strategy:
      # 看到确认后的球进入 Dribble；短暂漏检时不退出，避免动作模式反复切换。
      dribble_exit_delay: 1.0
      # 退出后需等待一小段时间才能再次进入，给底层动作控制器稳定退出的窗口。
      dribble_exit_cooldown: 2.0

    Skill:
      local_ball_hold: 2.0
      search_turn: 0.4

    Rerun:
      # 与原版 Demo 一样，主动连接开发电脑上已启动的 Rerun Viewer。
      enable_tcp: true
      server_ip: "192.168.50.113:9876"
