motion_node:
  ros__parameters:
    Motion:
      # A 进入 Custom；B 选择 Brain 控制，X 选择手柄控制。
      enabled: true
      max_forward: 1.25
      max_backward: 0.5
      max_left: 0.5
      max_turn: 1.5
      # 速度命令每 20 ms 更新；以下单位是 m/s²、m/s²、rad/s²。
      forward_acceleration: 1.3
      forward_deceleration: 2.0
      left_acceleration: 1.2
      left_deceleration: 1.2
      turn_acceleration: 2.0
      turn_deceleration: 2.0
      # 下标由 MoveRequest.walk_slot 指定；-1 使用 turn/walk 的默认路由。
      walk_models:
        - exported_policy_k1.bin
      turn_model: exported_policy_k1_turn.bin
      # 下标 0 对应 KickRequest.model_slot=0。
      kick_models:
        - k1_kick_policy_138_v1.bin
